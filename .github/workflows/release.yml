# Builds the Measure desktop app from the private ramon427/Measure source and
# publishes the installers and update feeds here, where installed copies look
# for updates. There is one release line: every release is a full release that all
# installed copies update to. Started by hand or from the source repo's tooling:
#   gh workflow run release.yml -R ramon427/measure-releases -f ref=master
# Public repositories run Actions for free on every platform; the source is
# checked out with MEASURE_SOURCE_TOKEN and never committed here.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or commit in ramon427/Measure
        required: true
        default: master
      version:
        description: Version to release (1.2.3); empty bumps the latest release's patch
        required: false

permissions:
  contents: read

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve the source commit
        id: source
        run: |
          sha=$(gh api "repos/ramon427/Measure/commits/${{ inputs.ref }}" -q .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.MEASURE_SOURCE_TOKEN }}

      - name: Pick the version
        id: pick
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            latest=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//; s/-.*//')
            if [ -z "$latest" ]; then version="0.1.0"; else
              IFS=. read -r major minor patch <<<"$latest"; version="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # Notes list the desktop app's commits since the last release's source commit.
      - uses: actions/checkout@v5
        with:
          repository: ramon427/Measure
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.MEASURE_SOURCE_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Create the draft release
        run: |
          tag="v${{ steps.pick.outputs.version }}"
          previous=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          since=""
          if [ -n "$previous" ]; then
            since=$(gh release view "$previous" -R "$GITHUB_REPOSITORY" --json body -q .body | sed -n 's/.*<!-- source: \([0-9a-f]\{40\}\) -->.*/\1/p')
          fi
          range="${since:+$since..}${{ steps.source.outputs.sha }}"
          {
            echo "## What's changed"
            git -C source log --no-merges --format='- %s' "$range" -- apps/desktop apps/desktop-local packages/local-db | grep -v '^- Merge' | head -40
            echo
            echo "<!-- source: ${{ steps.source.outputs.sha }} -->"
          } > notes.md
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft \
              --title "${{ steps.pick.outputs.version }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  # Windows and Linux publish the release as soon as both are in; the Mac build waits on
  # Apple's notarization queue, which can take hours, and joins the release when it lands.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            target: --win
          - os: macos-latest
            platform: darwin
            target: --mac
          - os: ubuntu-latest
            platform: linux
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.platform == 'darwin' && 180 || 60 }}
    permissions:
      contents: write
    env:
      MEASURE_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      VITE_MEASURE_VERSION: ${{ needs.version.outputs.version }}
      MEASURE_RELEASE_SUPABASE_URL: ${{ vars.MEASURE_RELEASE_SUPABASE_URL }}
      MEASURE_RELEASE_SUPABASE_ANON_KEY: ${{ vars.MEASURE_RELEASE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ramon427/Measure
          ref: ${{ needs.version.outputs.sha }}
          token: ${{ secrets.MEASURE_SOURCE_TOKEN }}

      # Sources before 19a4fff53 keep the app in apps/desktop-local.
      - name: Find the app
        shell: bash
        run: echo "APP_DIR=$([ -d apps/desktop ] && echo apps/desktop || echo apps/desktop-local)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Other install scripts are skipped: better-sqlite3 ships its prebuilt binaries,
      # and electron-builder downloads Electron itself. Dependency patches still apply.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/dev/apply-dependency-patches.mjs

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Stage the app
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/stage-release.mjs --platform ${{ matrix.platform }}

      # Source maps never ship (they hold the source). The Linux job keeps them in a draft
      # release on the private source repo, where the app's scripts/symbolicate.mjs reads
      # them to turn reported stacks back into source lines. A failure here never blocks
      # the release; symbolicate.mjs falls back to rebuilding the release commit.
      - name: Keep the source maps privately
        if: matrix.platform == 'linux'
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ secrets.MEASURE_SOURCE_TOKEN }}
        run: |
          [ -d release/sourcemaps ] || { echo "No source maps in this source"; exit 0; }
          tag="desktop-sourcemaps-v${{ needs.version.outputs.version }}"
          tar -czf sourcemaps.tar.gz -C release/sourcemaps .
          gh release view "$tag" -R ramon427/Measure >/dev/null 2>&1 ||
            gh release create "$tag" -R ramon427/Measure --draft \
              --target "${{ needs.version.outputs.sha }}" \
              --title "Desktop ${{ needs.version.outputs.version }} source maps" \
              --notes "Source maps for symbolicate.mjs. Keep this a draft."
          gh release upload "$tag" sourcemaps.tar.gz -R ramon427/Measure --clobber

      # macOS is signed with the Developer ID certificate and notarized with the App Store
      # Connect key, so installed Mac copies can update themselves. Only the Mac job gets
      # them. The certificate goes into a keychain here rather than through CSC_LINK:
      # electron-builder unlocks its own keychain with the certificate's password, which
      # fails on current macOS.
      - name: Prepare macOS signing
        if: matrix.platform == 'darwin'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain"
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          {
            echo "CSC_NAME=Ramon Verheuvel (W5836LL4H7)"
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # The release exists, so electron-builder uploads into it. Windows and Linux only
      # upload into the draft. The Mac build may finish after the release is published, so
      # it uploads into a published release of any age too (it never creates one).
      - name: Package and upload to the release
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --projectDir release/app --config ../../electron-builder.config.cjs ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'darwin' }}
          EP_PRE_RELEASE: ${{ matrix.platform == 'darwin' }}
          EP_GH_IGNORE_TIME: ${{ matrix.platform == 'darwin' }}

      # Whichever of Windows and Linux finishes second publishes, so installed Windows and
      # Linux copies never see a release without their installer. Mac copies find no
      # latest-mac.yml until the Mac build lands and keep their current version until then.
      - name: Publish once the Windows and Linux feeds are in
        if: matrix.platform != 'darwin'
        # Windows runners default to PowerShell.
        shell: bash
        run: |
          tag="v${{ needs.version.outputs.version }}"
          assets=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for file in latest.yml latest-linux.yml; do
            if ! grep -qx "$file" <<<"$assets"; then
              echo "The $tag draft has no $file yet; the other build publishes it"
              exit 0
            fi
          done
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
